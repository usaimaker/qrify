name: Ping Search Engines

on:
  push:
    branches: [main]
    paths-ignore:
      - 'stats/**'
  schedule:
    - cron: '0 2 * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Ping Bing via IndexNow
        run: |
          curl -s -o /dev/null -w "Bing: %{http_code}\n" \
            -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"host":"qrify.dynv6.net","key":"d92610460fb215d355e0fa3ff77d983f","keyLocation":"https://qrify.dynv6.net/d92610460fb215d355e0fa3ff77d983f.txt","urlList":["https://qrify.dynv6.net/","https://qrify.dynv6.net/qr-code-with-logo","https://qrify.dynv6.net/wifi-qr-code","https://qrify.dynv6.net/vcard-qr-code","https://qrify.dynv6.net/svg-qr-code"]}'

      - name: Ping Yandex
        run: |
          curl -s -o /dev/null -w "Yandex: %{http_code}\n" \
            -X POST "https://yandex.com/indexnow" \
            -H "Content-Type: application/json" \
            -d '{"host":"qrify.dynv6.net","key":"d92610460fb215d355e0fa3ff77d983f","keyLocation":"https://qrify.dynv6.net/d92610460fb215d355e0fa3ff77d983f.txt","urlList":["https://qrify.dynv6.net/","https://qrify.dynv6.net/qr-code-with-logo","https://qrify.dynv6.net/wifi-qr-code","https://qrify.dynv6.net/vcard-qr-code","https://qrify.dynv6.net/svg-qr-code"]}'
